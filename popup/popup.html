<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Page Screenshot Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container" id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-main">
        <div class="logo-badge">
          <svg class="camera-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
            <circle cx="12" cy="13" r="3"></circle>
          </svg>
        </div>
        <div class="header-text">
          <h1 class="app-title">اسکرین‌شات کامل صفحه</h1>
          <span class="app-badge">CDP Engine v1.3</span>
        </div>
      </div>
      <div class="tab-domain" id="tabDomain">در حال خواندن آدرس...</div>
    </header>

    <!-- Alert / Warning Container -->
    <div class="alert-box hidden" id="alertBox">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span class="alert-text" id="alertText"></span>
    </div>

    <!-- Main Form Controls -->
    <main class="controls-area" id="controlsArea">
      
      <!-- 1. Capture Mode Selection -->
      <section class="control-group">
        <label class="group-label">حالت عکسبرداری</label>
        <div class="mode-grid">
          <button type="button" class="mode-card active" data-mode="full" id="modeFullBtn">
            <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
            <span class="mode-title">کل صفحه وب</span>
            <span class="mode-desc">از بالا تا پایین‌ترین نقطه سند</span>
          </button>

          <button type="button" class="mode-card" data-mode="visible" id="modeVisibleBtn">
            <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span class="mode-title">بخش قابل مشاهده</span>
            <span class="mode-desc">فقط محدوده فعلی اسکرین</span>
          </button>
        </div>
      </section>

      <!-- 2. Format & Quality -->
      <section class="control-group">
        <div class="group-header-row">
          <label class="group-label">فرمت فایل خروجی</label>
          <div class="format-pill-group">
            <button type="button" class="format-pill active" data-format="png" id="formatPngBtn">PNG</button>
            <button type="button" class="format-pill" data-format="jpeg" id="formatJpegBtn">JPEG</button>
          </div>
        </div>

        <!-- JPEG Quality Slider (Hidden for PNG) -->
        <div class="quality-wrapper hidden" id="qualityWrapper">
          <div class="quality-header">
            <span class="quality-label">کیفیت فشرده‌سازی JPEG:</span>
            <span class="quality-value" id="qualityValue">90%</span>
          </div>
          <input type="range" min="50" max="100" value="90" class="range-slider" id="qualitySlider">
        </div>
      </section>

      <!-- 3. Viewport Selection -->
      <section class="control-group">
        <label class="group-label">عرض صفحه (Viewport / Responsive)</label>
        <div class="viewport-chips" id="viewportChips">
          <button type="button" class="chip active" data-vp="current" id="vpCurrent">عرض فعلی</button>
          <button type="button" class="chip" data-vp="mobile" id="vpMobile">موبایل ۳۹۰</button>
          <button type="button" class="chip" data-vp="tablet" id="vpTablet">تبلت ۷۶۸</button>
          <button type="button" class="chip" data-vp="desktop" id="vpDesktop">دسکتاپ ۱۳۶۶</button>
          <button type="button" class="chip" data-vp="custom" id="vpCustom">سفارشی</button>
        </div>

        <div class="custom-width-row hidden" id="customWidthRow">
          <label for="customWidthInput" class="custom-width-label">عرض دلخواه (پیکسل):</label>
          <input type="number" min="320" max="3840" value="1200" id="customWidthInput" class="num-input">
        </div>
      </section>

      <!-- 4. Lazy Load Switch -->
      <section class="control-group">
        <label class="switch-row" for="preloadLazyToggle">
          <div class="switch-info">
            <span class="switch-title">بارگذاری کامل تصاویر تنبل (Lazy Load)</span>
            <span class="switch-desc">اسکرول خودکار قبل از عکس برای ظاهر شدن تصاویر</span>
          </div>
          <div class="switch-control">
            <input type="checkbox" id="preloadLazyToggle" class="sr-only">
            <span class="switch-slider"></span>
          </div>
        </label>
      </section>

      <!-- 5. Capture Action Button -->
      <button type="button" class="btn-capture" id="btnCapture">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span id="btnCaptureText">گرفتن اسکرین‌شات کامل</span>
      </button>

      <!-- 6. Status and Progress Box -->
      <div class="status-box hidden" id="statusBox">
        <div class="status-top">
          <div class="spinner" id="statusSpinner"></div>
          <span class="status-label" id="statusLabel">در حال اتصال به صفحه...</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="status-detail" id="statusDetail"></div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-content">
       <a href="https://github.com/abolfazltalebi">abolfaz talebi</a>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
